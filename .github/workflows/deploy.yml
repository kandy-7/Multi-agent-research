name: Deploy to EC2

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker pull ghcr.io/kandy-7/multi-agent-research:latest
            docker stop ai-research-agent || true
            docker rm ai-research-agent || true
            docker run -d \
              --name ai-research-agent \
              -p 8000:8000 \
              --env-file .env \
              --restart unless-stopped \
              ghcr.io/kandy-7/multi-agent-research:latest